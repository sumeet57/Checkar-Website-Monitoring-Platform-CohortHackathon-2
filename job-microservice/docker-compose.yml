services:
  job-service:
    build: .
    container_name: job-service
    restart: always
    # No hard 'limits' ensures the service can grow into new RAM/CPU after resize
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 256M
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge